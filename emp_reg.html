<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration form 1</title>
    <style>
        body{
            font-family: Arial;
            background-color: orange;
        }

        form{
            background-color: darkgray;
            width: 300px;
            margin: auto;
            border: 1px solid black;
            padding: 15px;
            border-radius: 5PX;
        }

        input[type="radio"]{
        width: auto;
        }

        input{
            
            width: 95%;
            padding: 5px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 5PX;
        }

        button{
            color:white;
            background-color: blue;
            padding: 5px 10px;
        }

        button:hover{
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">EMPLOYEE REGISTRATION FORM</h1>
    <form onsubmit="return validate()">
        <label>First name:</label>
        <input type="text" id="fn" placeholder="Enter first name">
        <br><br>
        <label>Last name:</label>
        <input type="text" id="ln" placeholder="Enter last name">
        <br><br>
        <label>Employee ID:</label>
        <input type="text" id="eid" placeholder="Enter Employee ID">
        <br><br>
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email id">
        <br><br>
        <label>Phone number:</label>
        <input type="tel" id="pn" placeholder="Enter phone number">  
        <br><br>
        <label>Alternate Phone number:</label>
        <input type="tel" id="apn" placeholder="Enter alternate phone number">  
        <br><br>
        <label>DOB:</label>
        <input type="date">
        <br><br>
        <label>Designation:</label>
        <select id="Designation">
            <option>Sales Head</option>
            <option>HR</option>
            <option>Employee</option>
            <option>Manager</option>
        </select>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="male">
        <label>Male</label> 
        <input type="radio" name="gender" value="female"> 
        <label>Female</label>
        <input type="radio" name="gender" value="other"> 
        <label>Other</label>
        <br><br>
        <label>Salary:</label>
        <input type="number" id="sal">
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Redo</button>
    </form>

    <script>
function validate()
{
    let last=document.getElementById("ln").value;
    let first=document.getElementById("fn").value;
    let eid=document.getElementById("eid").value;
    let mail=document.getElementById("email").value;
    let num=document.getElementById("pn").value;
    let num1=document.getElementById("apn").value;
    let sal=document.getElementById("sal").value;

    if(first=="")
    {
        alert('Enter a first name');
        return false;
    }

    if(last=="")
    {
        alert('Enter a last name');
        return false;
    }

    if(eid=="")
    {
        alert('Enter a valid roll number');
        return false;
    }

    if(mail.indexOf("@")==-1 || mail.indexOf(".")==-1)
    {
        alert('Enter a valid email id');
        return false;
    }

    if(num.length!=10)
    {
        alert('Enter a valid phone number');
        return false;
    }

    if(num1.length!=10)
    {
        alert('Enter a valid phone number');
        return false;
    }

    if(sal.length==0)
    {
        alert('Enter a valid salary amount');
        return false;
    }

    return true;

}
</script>
    
</body>

</html>
